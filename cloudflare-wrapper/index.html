<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MindShelf" />
  <title>MindShelf — AI Bookmark Library</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 46V20a5 5 0 0 1 5-5h23v34H23a5 5 0 0 0 0 10h23' fill='none' stroke='%23fff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #090b10;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    }
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: #94a3b8;
      font-size: 0.85rem;
      z-index: 1;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 2;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <span>Loading MindShelf...</span>
  </div>
  <!-- Replace YOUR_DEPLOYMENT_ID with your deployed Google Apps Script Web App URL -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"
    allow="clipboard-read; clipboard-write"
    title="MindShelf — AI Bookmark Library"
  ></iframe>
</body>
</html>
